[package]
name = "slopity-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "slopity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "slopity"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
slopity-core = { path = "../../../crates/slopity-core" }
slopity-runtime-http = { path = "../../../crates/slopity-runtime-http" }
tauri.workspace = true
tauri-plugin-slopity-host = { path = "../../../plugins/tauri-plugin-slopity-host" }
