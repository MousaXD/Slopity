name: Linux and Android CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    name: Rust quality
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - name: Require progress ledger
        if: github.event_name == 'pull_request'
        run: ./scripts/check-progress-ledger.sh "${{ github.event.pull_request.base.sha }}" "$GITHUB_SHA"
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --all-features
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  linux:
    name: Linux Tauri shell
    needs: rust
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify Linux Tauri prerequisites
        run: bash scripts/check-linux-prerequisites.sh
      - working-directory: apps/slopity
        run: npm install --no-audit --no-fund
      - name: Compile Linux Tauri shell without bundling
        working-directory: apps/slopity
        run: npm run tauri:check

  android:
    name: Android ARM64 debug
    needs: linux
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
      - name: Configure Android environment
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - working-directory: apps/slopity
        run: npm install --no-audit --no-fund
      - name: Initialize Android project
        working-directory: apps/slopity
        run: npm run android:init -- --ci
      - name: Build ARM64 debug APK
        working-directory: apps/slopity
        run: npm run android:build -- --debug --target aarch64
      - name: Validate merged Android host manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=""
          while IFS= read -r candidate; do
            if grep -q 'com.slopity.host.HostForegroundService' "$candidate"; then
              manifest="$candidate"
              break
            fi
          done < <(find apps/slopity/src-tauri/gen/android/app/build/intermediates -type f -name AndroidManifest.xml -print)
          test -n "$manifest"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$manifest"
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$manifest"
          grep -q 'android:foregroundServiceType="specialUse"' "$manifest"
          echo "Validated merged host manifest: $manifest"
      - name: Upload Android debug packages
        uses: actions/upload-artifact@v7
        with:
          name: slopity-android-debug-${{ github.sha }}
          path: |
            apps/slopity/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
            apps/slopity/src-tauri/gen/android/app/build/outputs/bundle/universalDebug/app-universal-debug.aab
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
