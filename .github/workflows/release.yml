name: Package and publish releases

on:
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'crates/**'
      - 'plugins/**'
      - 'apps/slopity/**'
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'New version tag matching application metadata, for example v0.2.0'
        required: true
        type: string

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      build: ${{ steps.meta.outputs.build }}
      publish: ${{ steps.meta.outputs.publish }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate version metadata and release intent
        id: meta
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          readarray -t versions < <(python3 - <<'PY'
          import json
          import tomllib

          with open('apps/slopity/src-tauri/tauri.conf.json', encoding='utf-8') as handle:
              tauri = json.load(handle)
          with open('apps/slopity/package.json', encoding='utf-8') as handle:
              package = json.load(handle)
          with open('Cargo.toml', 'rb') as handle:
              cargo = tomllib.load(handle)

          print(tauri['version'])
          print(package['version'])
          print(cargo['workspace']['package']['version'])
          PY
          )

          if [[ ${#versions[@]} -ne 3 ]]; then
            echo 'Unable to resolve all application versions.' >&2
            exit 1
          fi

          version="${versions[0]}"
          if [[ "${versions[1]}" != "$version" || "${versions[2]}" != "$version" ]]; then
            printf 'Version mismatch: tauri=%s package=%s cargo=%s\n' "${versions[0]}" "${versions[1]}" "${versions[2]}" >&2
            exit 1
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            printf 'Application version %s is not an accepted release version.\n' "$version" >&2
            exit 1
          fi

          expected_tag="v${version}"
          release_tag="$expected_tag"
          build=true
          publish=false

          case "$GITHUB_EVENT_NAME" in
            pull_request)
              publish=false
              ;;
            workflow_dispatch)
              if [[ "$GITHUB_REF_TYPE" != 'branch' || "$GITHUB_REF_NAME" != 'main' ]]; then
                printf 'Manual release dispatch must run from main, not %s/%s.\n' "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME" >&2
                exit 1
              fi
              release_tag="$DISPATCH_TAG"
              publish=true
              if git ls-remote --exit-code --tags origin "refs/tags/$release_tag" >/dev/null 2>&1; then
                printf 'Manual release tag %s already exists. Reused tags are not published or mutated; bump the version instead.\n' "$release_tag" >&2
                exit 1
              fi
              ;;
            push)
              if [[ "$GITHUB_REF_TYPE" == 'tag' ]]; then
                release_tag="$GITHUB_REF_NAME"
                publish=true
                git fetch --no-tags origin main
                if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                  printf 'Release tag %s points to %s, which is not reachable from main.\n' "$release_tag" "$GITHUB_SHA" >&2
                  exit 1
                fi
                if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
                  printf 'GitHub Release %s already exists. Reruns do not mutate an existing release.\n' "$release_tag" >&2
                  exit 1
                fi
              elif [[ "$GITHUB_REF_NAME" == 'main' ]]; then
                if git ls-remote --exit-code --tags origin "refs/tags/$expected_tag" >/dev/null 2>&1; then
                  echo "$expected_tag already exists; duplicate main pushes intentionally skip package build and publication."
                  build=false
                  publish=false
                else
                  publish=true
                fi
              else
                echo "Unsupported release push ref: $GITHUB_REF" >&2
                exit 1
              fi
              ;;
            *)
              echo "Unsupported release event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac

          if [[ "$release_tag" != "$expected_tag" ]]; then
            printf 'Release tag %s does not match application version %s. Expected %s.\n' "$release_tag" "$version" "$expected_tag" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          printf 'version=%s tag=%s build=%s publish=%s\n' "$version" "$release_tag" "$build" "$publish"

  linux:
    name: Linux .deb and AppImage
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.89.0
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/slopity/package-lock.json
      - name: Install Linux Tauri system dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Verify Linux Tauri prerequisites
        run: bash scripts/check-linux-prerequisites.sh
      - name: Install frontend dependencies
        working-directory: apps/slopity
        run: npm ci
      - name: Build Linux release bundles
        working-directory: apps/slopity
        run: npm run tauri:build -- --bundles deb,appimage
      - name: Collect Linux release assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf release-staging/linux
          mkdir -p release-staging/linux
          mapfile -d '' debs < <(find "$GITHUB_WORKSPACE" -type f -path '*/target/release/bundle/deb/*.deb' -print0)
          mapfile -d '' appimages < <(find "$GITHUB_WORKSPACE" -type f -path '*/target/release/bundle/appimage/*.AppImage' -print0)

          if [[ ${#debs[@]} -ne 1 ]]; then
            printf 'Expected exactly one .deb bundle, found %d.\n' "${#debs[@]}" >&2
            printf '%s\n' "${debs[@]:-}" >&2
            exit 1
          fi
          if [[ ${#appimages[@]} -ne 1 ]]; then
            printf 'Expected exactly one AppImage bundle, found %d.\n' "${#appimages[@]}" >&2
            printf '%s\n' "${appimages[@]:-}" >&2
            exit 1
          fi

          cp "${debs[0]}" release-staging/linux/
          cp "${appimages[0]}" release-staging/linux/
          ls -lh release-staging/linux
      - name: Upload Linux package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-linux-${{ github.sha }}
          path: release-staging/linux/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  android:
    name: Android ARM64 debug packages
    needs: prepare
    if: needs.prepare.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.89.0 and Android targets
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: 1.89.0
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/slopity/package-lock.json
      - name: Set up Java 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Install Android SDK and NDK
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.3.13750724"
      - name: Configure Android environment
        shell: bash
        run: |
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
      - name: Install frontend dependencies
        working-directory: apps/slopity
        run: npm ci
      - name: Initialize Android project
        working-directory: apps/slopity
        run: npm run android:init -- --ci
      - name: Build ARM64 debug APK and AAB
        working-directory: apps/slopity
        run: npm run android:build -- --debug --target aarch64
      - name: Validate merged Android host manifest
        shell: bash
        run: |
          set -euo pipefail
          manifest=""
          while IFS= read -r candidate; do
            if grep -q 'com.slopity.host.HostForegroundService' "$candidate"; then
              manifest="$candidate"
              break
            fi
          done < <(find apps/slopity/src-tauri/gen/android/app/build/intermediates -type f -name AndroidManifest.xml -print)
          test -n "$manifest"
          grep -q 'android.permission.POST_NOTIFICATIONS' "$manifest"
          grep -q 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' "$manifest"
          grep -q 'android:foregroundServiceType="specialUse"' "$manifest"
          echo "Validated merged host manifest: $manifest"
      - name: Collect Android debug release assets
        shell: bash
        run: |
          set -euo pipefail
          apk='apps/slopity/src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk'
          aab='apps/slopity/src-tauri/gen/android/app/build/outputs/bundle/universalDebug/app-universal-debug.aab'
          test -f "$apk"
          test -f "$aab"
          rm -rf release-staging/android
          mkdir -p release-staging/android
          cp "$apk" release-staging/android/
          cp "$aab" release-staging/android/
          ls -lh release-staging/android
      - name: Upload Android debug package artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-android-arm64-debug-${{ github.sha }}
          path: release-staging/android/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release:
    name: Publish GitHub prerelease
    needs: [prepare, linux, android]
    if: needs.prepare.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Download Linux packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-linux-${{ github.sha }}
          path: dist/linux
      - name: Download Android debug packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-android-arm64-debug-${{ github.sha }}
          path: dist/android
      - name: Reject an existing GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            printf 'GitHub Release %s already exists. Existing releases are immutable to this workflow.\n' "$RELEASE_TAG" >&2
            exit 1
          fi
      - name: Name assets and generate SHA-256 checksums
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          rm -rf release-assets
          mkdir -p release-assets

          mapfile -d '' debs < <(find dist/linux -type f -name '*.deb' -print0)
          mapfile -d '' appimages < <(find dist/linux -type f -name '*.AppImage' -print0)
          mapfile -d '' apks < <(find dist/android -type f -name '*.apk' -print0)
          mapfile -d '' aabs < <(find dist/android -type f -name '*.aab' -print0)

          [[ ${#debs[@]} -eq 1 ]]
          [[ ${#appimages[@]} -eq 1 ]]
          [[ ${#apks[@]} -eq 1 ]]
          [[ ${#aabs[@]} -eq 1 ]]

          cp "${debs[0]}" "release-assets/Slopity_${RELEASE_VERSION}_linux-amd64.deb"
          cp "${appimages[0]}" "release-assets/Slopity_${RELEASE_VERSION}_linux-x86_64.AppImage"
          cp "${apks[0]}" "release-assets/Slopity_${RELEASE_VERSION}_android-arm64-debug.apk"
          cp "${aabs[0]}" "release-assets/Slopity_${RELEASE_VERSION}_android-arm64-debug.aab"

          (cd release-assets && sha256sum Slopity_* > SHA256SUMS.txt)
          cat release-assets/SHA256SUMS.txt
      - name: Publish immutable preview release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Slopity ${{ needs.prepare.outputs.tag }} Preview
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          body: |
            Preview packages for Slopity ${{ needs.prepare.outputs.version }}.

            - Linux `.deb` and AppImage are release-mode Tauri bundles built on hosted Linux x86_64.
            - Android APK/AAB are ARM64 **debug** packages. Production Android signing is not configured.
            - `SHA256SUMS.txt` contains SHA-256 checksums for all four packages.
            - Existing tags/releases are never overwritten by this workflow.

            This release remains a prerelease until production signing and physical-device release validation are complete.
          files: |
            release-assets/*.deb
            release-assets/*.AppImage
            release-assets/*.apk
            release-assets/*.aab
            release-assets/SHA256SUMS.txt
